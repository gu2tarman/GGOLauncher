name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      - name: Validate release version and bundled assets
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = (Get-Content -Raw -Encoding UTF8 "package.json" | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw -Encoding UTF8 "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $cargoText = Get-Content -Raw -Encoding UTF8 "src-tauri/Cargo.toml"
          $cargoVersion = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value

          $versions = [ordered]@{
            tag = $tagVersion
            package = $packageVersion
            tauri = $tauriVersion
            cargo = $cargoVersion
          }
          $versions.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key)=$($_.Value)" }
          if (@($versions.Values | Select-Object -Unique).Count -ne 1) {
            throw "Release version mismatch: tag/package/tauri/cargo must be identical"
          }

          $requiredAssets = @(
            "public/bg-default.jpg",
            "public/fonts/PretendardVariable.woff2",
            "public/fonts/LICENSE-Pretendard.txt"
          )
          foreach ($asset in $requiredAssets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Required bundled asset missing: $asset"
            }
            Write-Host "asset=$asset size=$((Get-Item -LiteralPath $asset).Length)"
          }

      - name: Tauri build
        run: npm run tauri build

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ggo-launcher.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "ggo-launcher.exe: size=$size bytes, sha256=$hash"

      - name: Build release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = Get-Content -Raw -Encoding UTF8 "RELEASE_NOTES.md"
          $pattern = "(?ms)^##\s+$([regex]::Escape($tag))\s*\r?\n(?<body>.*?)(?=^##\s+v|\z)"
          $m = [regex]::Match($notes, $pattern)
          if (-not $m.Success) {
            throw "Release notes section not found for $tag"
          }
          $body = $m.Groups["body"].Value.Trim()
          @"
          ## GGO Launcher $tag

          $body

          ### 다운로드
          - **GGOLauncher.exe**: 단일 실행 파일
          - **NSIS setup exe**: 설치 파일

          ### 자동 업데이트 매니페스트 값
          ~~~text
          version: $($tag.TrimStart("v"))
          size:    ${{ steps.hash.outputs.size }}
          sha256:  ${{ steps.hash.outputs.sha256 }}
          url:     GitHub Release의 GGOLauncher.exe 다운로드 링크
          ~~~
          "@ | Set-Content -Encoding UTF8 "release-body.md"

      - name: Rename single-exe for release artifact
        shell: pwsh
        run: |
          Copy-Item -Path "src-tauri/target/release/ggo-launcher.exe" `
                    -Destination "src-tauri/target/release/GGOLauncher.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "GGO Launcher ${{ github.ref_name }}"
          body_path: release-body.md
          files: |
            src-tauri/target/release/GGOLauncher.exe
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
