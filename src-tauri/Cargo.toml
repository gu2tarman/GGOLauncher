[package]
name = "ggo-launcher"
version = "0.2.2"
description = "GGO Custom Edition Launcher"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ggo_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# HTTP: rustls 사용 (openssl 회피 — Windows에서 빌드 단순)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
# 네이티브 폴더/파일 선택 다이얼로그
rfd = "0.15"
# ZIP 추출 (ClassicAssist 같은 통째 ZIP 플러그인 import)
zip = { version = "2", default-features = false, features = ["deflate"] }
# DPAPI 인코딩용
base64 = "0.22"
# SHA256 파일 해싱 (manifest 비교용)
sha2 = "0.10"
# reqwest 스트리밍용
futures-util = "0.3"

# Windows Shell API (ShellExecuteExW elevation, DPAPI 비밀번호 암호화)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
