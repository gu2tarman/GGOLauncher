[package]
name = "ggo-launcher"
version = "0.1.0"
description = "GGO Custom Edition Launcher"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ggo_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# HTTP: rustls 사용 (openssl 회피 — Windows에서 빌드 단순)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
